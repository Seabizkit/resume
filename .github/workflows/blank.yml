name: Generate Resume PDF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended

      - name: Generate PDF
        run: |
          pandoc README.md \
            -o resume.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in

      - name: Commit PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate resume PDF"
          file_pattern: resume.pdf

name: Generate README PDF

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'

jobs:
  convert-to-pdf:
    name: Build PDF from README
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Convert the README.md file into a PDF
      - name: Convert Markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: README.md
          output_dir: pdf-output
          build_html: false

      # Step 3: Upload the generated PDF as a downloadable workflow artifact
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-pdf
          path: pdf-output/README.pdf

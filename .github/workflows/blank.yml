name: Generate Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/generate-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc chromium-browser

      - name: Generate PDF
        run: |
          pandoc README.md \
            --from=gfm \
            --pdf-engine=/usr/bin/chromium-browser \
            -V margin-top=20mm \
            -V margin-bottom=20mm \
            -V margin-left=20mm \
            -V margin-right=20mm \
            -o Resume.pdf

      - name: Commit PDF
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Auto-generate Resume.pdf"
          file_pattern: Resume.pdf
